name: Build and Push llama-swap Vulkan Image

on:
  schedule:
    # Daily at 4AM
    - cron: '0 4 * * *'
  workflow_dispatch: {}

env:
  DOCKERHUB_IMAGE: knighthat/llama-swap
  LLAMACPP_REPO: ggml-org/llama.cpp
  LLAMASWAP_REPO: mostlygeek/llama-swap

concurrency:
  group: build-push-image
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      llamacpp_tag: ${{ steps.versions.outputs.llamacpp_tag }}
      llamaswap_tag: ${{ steps.versions.outputs.llamaswap_tag }}
      image_tag: ${{ steps.versions.outputs.image_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve latest versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Latest llama.cpp nightly (bNNNN) release
          LLAMACPP_TAG=$(gh api "repos/${LLAMACPP_REPO}/releases?per_page=100" \
            --jq '[.[] | select(.prerelease == true and .draft == false)][0].tag_name // empty')

          # Latest llama-swap stable (non-prerelease) release
          LLAMASWAP_TAG=$(gh api "repos/${LLAMASWAP_REPO}/releases/latest" \
            --jq '.tag_name // empty')

          if [ -z "$LLAMACPP_TAG" ]; then
            echo "::error::Could not resolve latest llama.cpp release" ; exit 1
          fi
          if [ -z "$LLAMASWAP_TAG" ]; then
            echo "::error::Could not resolve latest llama-swap release" ; exit 1
          fi

          IMAGE_TAG="${LLAMASWAP_TAG}-vulkan-${LLAMACPP_TAG}-non-root"

          echo "llamacpp_tag=${LLAMACPP_TAG}"   >> "$GITHUB_OUTPUT"
          echo "llamaswap_tag=${LLAMASWAP_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}"         >> "$GITHUB_OUTPUT"

          echo "llama.cpp:   ${LLAMACPP_TAG}"
          echo "llama-swap:  ${LLAMASWAP_TAG}"
          echo "image tag:   ${IMAGE_TAG}"

      - name: Skip if this exact version was already published
        id: check
        run: |
          set -euo pipefail
          TAG="${{ steps.versions.outputs.image_tag }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE}/tags/${TAG}")
          if [ "$STATUS" = "200" ]; then
            echo "::notice::${TAG} already on Docker Hub — skipping build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${TAG} is new — building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-versions
    if: github.event_name == 'workflow_dispatch' || needs.check-versions.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (Dockerfile, config.yaml)
        uses: actions/checkout@v4

      - name: Checkout llama.cpp @ ${{ needs.check-versions.outputs.llamacpp_tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMACPP_REPO }}
          ref: ${{ needs.check-versions.outputs.llamacpp_tag }}
          path: llama.cpp

      - name: Checkout llama-swap @ ${{ needs.check-versions.outputs.llamaswap_tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMASWAP_REPO }}
          ref: ${{ needs.check-versions.outputs.llamaswap_tag }}
          path: llama-swap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        # Don't push if ran using `nektos/act`
        if: ${{ !env.ACT }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:vulkan-non-root
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.check-versions.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
